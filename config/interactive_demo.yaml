schema_version: 1
host: 127.0.0.1
port: 8770
default_scene: blocks
default_seed: 42
default_backend: qwen
render_hz: 5
realtime_factor: 1.0
transport_height_m: 0.22
max_task_s: 120
# The first view is config/vlm/wrist_camera.yaml's observation pose.
observation_search_q_rad:
  - [0.0, 0.7, -0.85, 0.0, 1.15, 0.0]
  - [0.0, 0.4, -0.8, 0.0, 1.2, 0.0]
  - [0.15, 0.4, -0.8, 0.0, 1.2, 0.0]
max_grasp_attempts: 2
image_border_margin_px: 4
depth_recovery_view_index: 2
# Partial target geometry is used only for aiming, never directly for grasping.
active_view:
  enabled: true
  max_attempts: 3
  max_joint_step_rad: 0.35
  backoff_m: 0.025
  min_tcp_clearance_m: 0.10
demos:
  # Six distinct objects, with up to two additional attempts for incomplete sorting.
  # Category -> tray rules live in config/competition/scene.yaml tasks.l1/l2.mapping.
  l2_max_attempts: 8
  fruit_spawn:
    x_m: [0.24, 0.49]
    y_m: [-0.10, 0.19]
