[project]
name = "piper-competition-sim"
version = "0.1.0"
description = "PiPER sorting simulation based on an existing interactive demo"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mujoco==3.17.0", "numpy==2.2.6", "scipy==1.15.3",
  "opencv-python-headless==5.0.0.93", "PyYAML==6.0.3",
  "Pillow==12.3.0", "scikit-image==0.25.2"
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piper_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
